alerts:
  - name: latency_p95_high
    severity: warning
    condition: "latency_p95_ms > 3000 over rolling 5m"
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: platform-oncall
    runbook: docs/alerts.md#latency-p95-high
  - name: chat_error_rate_high
    severity: critical
    condition: "error_rate_pct > 2 over rolling 5m"
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: platform-oncall
    runbook: docs/alerts.md#chat-error-rate-high
  - name: retrieval_success_low
    severity: warning
    condition: "retrieval_success_rate_pct < 90 over rolling 10m"
    duration: 10m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: ai-platform
    runbook: docs/alerts.md#retrieval-success-low
